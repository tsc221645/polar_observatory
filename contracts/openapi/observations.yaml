openapi: 3.1.0
info:
  title: Polar Observatory API
  version: 0.1.0-draft
  description: Proposed contract for the first Southern Hemisphere sea ice extent series.
servers:
  - url: /api/v1
paths:
  /observations:
    get:
      operationId: listObservations
      summary: List current accepted observation revisions
      description: Pages are ordered by observation timestamp and then by observation ID, both ascending.
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [sea_ice_extent]
        - name: entity
          in: query
          required: true
          schema:
            type: string
          example: hemisphere:south
        - name: from
          in: query
          required: true
          description: Inclusive UTC calendar date. The interval must be at most ten years.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Exclusive UTC calendar date after the start date.
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
        - name: cursor
          in: query
          description: Opaque continuation token returned by the previous page for the same filters.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Observation page. An empty matching range returns an empty data array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationPage'
        '400':
          description: Malformed query parameter or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Query violates a supported metric, date range, or page limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ObservationPage:
      type: object
      required: [data, next_cursor, meta]
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Observation'
        next_cursor:
          type: [string, 'null']
          description: Null on the final page.
        meta:
          type: object
          required: [source_version, as_of]
          properties:
            source_version:
              type: string
            as_of:
              type: [string, 'null']
              format: date-time
              description: UTC timestamp of the publication backing this response, or null before the first publication.
    Observation:
      type: object
      required: [timestamp, value, unit, quality, source_id, artifact_id]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Start of the observation day in UTC.
        value:
          type: [number, 'null']
          minimum: 0
          description: Published extent normalized to square kilometers, or null for missing values.
        unit:
          type: string
          const: km2
        quality:
          type: string
        source_id:
          type: string
        artifact_id:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
